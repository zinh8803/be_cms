version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yii2-app
    restart: always
    volumes:
      - .:/var/web/be_CMS
      # Persistent uploads folder
      - uploads_data:/var/web/be_CMS/web/uploads
    environment:
      - DB_HOST=db
      - DB_NAME=db_CMS
      - DB_USER=cms_user
      - DB_PASSWORD=cms_pass
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis

  web:
    image: nginx:alpine
    container_name: yii2-web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/web/be_CMS
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - uploads_data:/var/web/be_CMS/web/uploads
    depends_on:
      - app

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yii2-queue-worker
    restart: always
    volumes:
      - .:/var/web/be_CMS
    environment:
      - DB_HOST=db
      - DB_NAME=db_CMS
      - DB_USER=cms_user
      - DB_PASSWORD=cms_pass
      - REDIS_HOST=redis
    command: php yii queue/listen
    depends_on:
      - db
      - redis
      - app

  db:
    image: mysql:8.0
    container_name: yii2-db
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=db_CMS
      - MYSQL_USER=cms_user
      - MYSQL_PASSWORD=cms_pass
      - MYSQL_ROOT_PASSWORD=root_pass
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: yii2-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
  uploads_data:
